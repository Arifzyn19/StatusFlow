# Nginx reverse proxy for StatusFlow (Ubuntu VPS + HTTPS via Certbot)
# API on 127.0.0.1:3001, Web on 127.0.0.1:3000. SSE needs buffering off.

upstream statusflow_web { server 127.0.0.1:3000; }
upstream statusflow_api { server 127.0.0.1:3001; }

server {
  listen 80;
  server_name status.example.com;

  client_max_body_size 150M;

  location /api/events {
    proxy_pass http://statusflow_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://statusflow_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://statusflow_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
